name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME || secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE || secrets.SSH_KEY_PASSPHRASE }}
          password: ${{ secrets.VPS_PASSWORD || secrets.SSH_PASSWORD }}
          script: |
            bash /var/www/dtailbase/deploy_vps_ols_dtailbase.sh