services:
  - type: web
    name: detailerflow-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn bookingweb.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: detailerflow-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

databases:
  - name: detailerflow-db
    plan: free # Change to 'standard' for production backups later